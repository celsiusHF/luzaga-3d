<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luzaga · Visor 3D</title>
<style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#f4f6f8;color:#253441;font:17px system-ui,sans-serif}main{text-align:center;padding:32px;max-width:480px}h1{font-size:24px;font-weight:600}p{line-height:1.6}</style>
</head>
<body><main><h1>Luzaga · Visor 3D</h1><p id="status" role="status">Cargando el modelo 3D…</p><noscript>Activa JavaScript para abrir el visor.</noscript></main>
<script>(async () => {
  try {
    const files = ["viewer.part000","viewer.part001","viewer.part002","viewer.part003","viewer.part004","viewer.part005","viewer.part006","viewer.part007","viewer.part008","viewer.part009","viewer.part010","viewer.part011","viewer.part012","viewer.part013","viewer.part014","viewer.part015","viewer.part016","viewer.part017","viewer.part018","viewer.part019","viewer.part020","viewer.part021","viewer.part022"];
    const chunks = await Promise.all(files.map(async (file) => {
      const response = await fetch(new URL(file, document.baseURI));
      if (!response.ok) throw new Error("No se pudo descargar " + file + ": " + response.status);
      return response.arrayBuffer();
    }));
    const stream = new Blob(chunks).stream().pipeThrough(new DecompressionStream("gzip"));
    const html = await new Response(stream).text();
    const frame = document.createElement("iframe");
    frame.title = "Visor 3D de Luzaga";
    frame.allowFullscreen = true;
    frame.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0;background:#282828";
    frame.src = URL.createObjectURL(new Blob([html], {type:"text/html;charset=utf-8"}));
    frame.addEventListener("load", () => {
      const loading = document.querySelector("main");
      if (loading) loading.remove();
    }, {once:true});
    document.body.appendChild(frame);
  } catch (error) {
    console.error(error);
    const status = document.getElementById("status");
    if (status) status.textContent = "No se ha podido cargar el visor. Recarga la página o prueba con un navegador actualizado.";
  }
})();</script>
</body>
</html>
